name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          ENVIRONMENT: DEVELOPMENT
          # Dummy values so imports succeed in CI — NOT real secrets.
          RANDOM_AES_SEED: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          SUPABASE_URL: http://localhost:54321
          SUPABASE_KEY: ci-dummy-key
        run: pytest -q

  webapp:
    name: Webapp (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
        run: npm run build
