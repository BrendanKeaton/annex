[package]
name = "annex"
version = "0.1.0"
description = "Annex desktop app"
authors = ["Annex contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "annex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
tauri-plugin-dialog = "2"
time = { version = "0.3.47", features = ["serde", "serde-human-readable", "local-offset", "macros"] }
walkdir = "2"
tokio = { version = "1", features = ["time", "rt", "sync"] }
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
aead = { version = "0.5", features = ["stream", "alloc"] }
rand = "0.8"
sha2 = "0.11"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_IO", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
